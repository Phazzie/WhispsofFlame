<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full space-y-8">
    <div class="text-center">
      <h1 class="text-4xl font-bold text-gray-900">WhispsofFlame</h1>
      <p class="mt-2 text-gray-600">Real-time collaborative task board</p>
    </div>

    <!-- Join Session Form -->
    <div class="bg-white p-8 rounded-lg shadow-md">
      <h2 class="text-xl font-semibold mb-4">Join Session</h2>
      <form (ngSubmit)="joinSession()">
        <input
          type="text"
          [(ngModel)]="sessionCode"
          (input)="onInputChange()"
          name="sessionCode"
          placeholder="ABC123"
          maxlength="6"
          class="w-full px-4 py-2 border rounded-md uppercase"
          data-testid="session-code-input"
        />
        @if (error) {
          <p class="text-red-500 text-sm mt-2">{{ error }}</p>
        }
        <button
          type="submit"
          class="w-full mt-4 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700"
          data-testid="join-session-btn"
        >
          Join Session
        </button>
      </form>
    </div>

    <!-- Create New Session -->
    <div class="text-center">
      <p class="text-gray-600 mb-2">or</p>
      <button
        (click)="createSession()"
        class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-700"
        data-testid="create-session-btn"
      >
        Create New Session
      </button>
    </div>
  </div>
</div>
