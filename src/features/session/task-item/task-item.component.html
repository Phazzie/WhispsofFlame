<div
  class="bg-white p-4 rounded-lg shadow-sm border"
  [class.opacity-50]="task.status === 'done'"
  [attr.data-testid]="'task-' + task.id"
>
  <div class="flex items-start justify-between gap-4">
    <!-- Content -->
    <div class="flex-1">
      @if (task.isSecret && !isRevealed()) {
        <p class="text-gray-400">🔒 Secret task ({{ task.votedBy.length }}/2 votes)</p>
      } @else {
        <p [class.line-through]="task.status === 'done'">{{ task.content }}</p>
      }
      <p class="text-xs text-gray-500 mt-1">
        By {{ task.createdBy }} · {{ formatDate(task.createdAt) }}
      </p>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2">
      @if (task.isSecret && !isRevealed()) {
        <button
          (click)="voteReveal()"
          class="px-3 py-1 text-sm bg-purple-100 text-purple-700 rounded hover:bg-purple-200"
          [attr.data-testid]="'reveal-btn-' + task.id"
        >
          Reveal ({{ task.votedBy.length }}/2)
        </button>
      }

      <label class="flex items-center gap-2">
        <input
          type="checkbox"
          [checked]="task.status === 'done'"
          (change)="toggleDone()"
          [attr.data-testid]="'done-toggle-' + task.id"
        />
        <span class="text-sm">Done</span>
      </label>

      <button
        (click)="deleteTask()"
        class="text-red-500 hover:text-red-700 text-sm"
        [attr.data-testid]="'delete-btn-' + task.id"
      >
        Delete
      </button>
    </div>
  </div>
</div>
