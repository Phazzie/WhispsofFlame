<div class="min-h-screen bg-gray-50">
  <!-- Header -->
  <header class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">Session: {{ sessionId }}</h1>
        <p class="text-sm text-gray-600">{{ user()?.displayName }} ({{ user()?.avatar }})</p>
      </div>
      <div class="flex items-center gap-2">
        <span [class]="connectionStatusClass()">{{ connectionStatus() }}</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    <!-- Task Form -->
    <div class="bg-white p-6 rounded-lg shadow-md mb-6">
      <h2 class="text-xl font-semibold mb-4">Add Task</h2>
      <form (ngSubmit)="addTask()">
        <input
          type="text"
          [(ngModel)]="newTaskContent"
          name="taskContent"
          placeholder="What needs to be done?"
          maxlength="200"
          class="w-full px-4 py-2 border rounded-md mb-2"
          data-testid="task-input"
        />
        <div class="flex items-center gap-4">
          <label class="flex items-center gap-2">
            <input
              type="checkbox"
              [(ngModel)]="isSecret"
              name="isSecret"
              data-testid="secret-toggle"
            />
            <span>Secret task</span>
          </label>
          <button
            type="submit"
            class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700"
            data-testid="add-task"
          >
            Add Task
          </button>
        </div>
      </form>
    </div>

    <!-- Task List -->
    <div class="space-y-4">
      <h2 class="text-xl font-semibold">Tasks ({{ taskService.tasks().length }})</h2>
      @for (task of taskService.tasks(); track task.id) {
        <app-task-item [task]="task" />
      }
      @empty {
        <p class="text-gray-500 text-center py-8">No tasks yet. Add one above!</p>
      }
    </div>
  </main>
</div>
